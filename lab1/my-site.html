<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Lab 1</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f6f8;
            padding: 20px;
            color: #222;
        }

        header {
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: #0b3c5d;
            font-size: 20px;
            background-color: #fff;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #dcdcdc;

        }

        header::after {
            content: "ИТМО";
            font-size: 14px;
            color: #777;
        }

        .layout-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .block-card {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            flex: 1 1 420px;
            max-width: 520px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 4%;
        }

        input[type="radio"] {
            margin-left: 2%;
            margin-right: 1%;
            cursor: pointer;
        }

        /*Поле ввода Y*/
        input[type="text"] {
            width: 85%;
            padding: 2%;
            margin-top: 1%;
            margin-bottom: 1%;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-family: inherit;
        }

        button {
            padding: 2.5% 5%;
            margin-top: 2%;
            background-color: #0b3c5d;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: inherit;
        }

        button:hover {
            background-color: #1d5f8a;
        }

        .error-msg {
            color: #d9534f;
            font-size: 13px;
            min-height: 18px;
        }

        /*таблица результатов*/
        .table-container {
            width: 100%;
            max-width: 960px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 15px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #dddddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        /*попадание */
        .hit {
            color: #28a745;
            font-weight: bold;
        }

        /*промах*/
        .miss {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        Гетман Юлия Сергеевна | Группа: P3320 | Вариант : 23462
    </header>
    <div class="layout-container">
        <div class="block-card" style="text-align: center;">
            <h3>Координатная плоскость</h3>
            <canvas id="graph-canvas" width="340" height="340"></canvas>
        </div>
        <div class="block-card">
            <h3>Ввод параметров</h3>
            <!--Форма отправки-->
            <form id="coords-form">

                <!-- X (Radio): -3, -2, -1, 0, 1, 2, 3, 4, 5 -->
                <div class="form-group">
                    <label>Изменение X (Radio):</label>
                    <div>
                        <label><input type="radio" name="x-val" value="-3">-3</label>
                        <label><input type="radio" name="x-val" value="-2">-2</label>
                        <label><input type="radio" name="x-val" value="-1">-1</label>
                        <label><input type="radio" name="x-val" value="0" checked>0</label>
                        <label><input type="radio" name="x-val" value="1">1</label>
                        <label><input type="radio" name="x-val" value="2">2</label>
                        <label><input type="radio" name="x-val" value="3">3</label>
                        <label><input type="radio" name="x-val" value="4">4</label>
                        <label><input type="radio" name="x-val" value="5">5</label>
                    </div>
                </div>

                <!-- Y (Text): (-3 ... 3) -->
                <div class="form-group">
                    <label for="y-input">Изменение Y: Text (-3 ... 3):</label>
                    <input type="text" id="y-input" placeholder="Введите число от -3 до 3">
                    <!-- сообщение об ошибке -->
                    <div id="error-y" class="error-msg"></div>
                </div>

                <!-- R (Radio): '1', '1.5', '2', '2.5', '3' -->
                <div class="form-group">
                    <label>Изменение R (Radio):</label>
                    <div>
                        <label><input type="radio" name="r-val" value="1">1</label>
                        <label><input type="radio" name="r-val" value="1.5">1.5</label>
                        <label><input type="radio" name="r-val" value="2" checked>2</label>
                        <label><input type="radio" name="r-val" value="2.5">2.5</label>
                        <label><input type="radio" name="r-val" value="3">3</label>
                    </div>
                </div>

                <!-- Кнопка отправки формы -->
                <button type="submit">Отправить</button>
                <button type="button" id="clear-btn" style="background-color: #d9534f; margin-left: 2%;">Очистить историю</button>
            </form>
        </div>
    </div>
    <!--Таблица результатов -->
    <div class="table-container">
        <h3>Таблица результатов</h3>
        <table>
            <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Попадание</th>
                    <th>Дата и время проверки</th>
                </tr>
            </thead>
            <!-- Сюда JS будет вставлять строчки проверок -->
            <tbody id="results-table-body"></tbody>
        </table>
    </div>
    <script src="main.js"></script>
</body>

</html>
